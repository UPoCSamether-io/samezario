<style>
        .dot-pattern {

        /* Map specific styles */
        .map-container {
            position: relative;
            width: 100%;
            margin: 0 auto;
        }
        .map-overlay {
            position: absolute;
            inset: 0;
            background-color: transparent;
            z-index: 10;
        }
        .map-region {
            position: absolute;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .region-unlocked {
            filter: drop-shadow(4px 4px 0px #181c1c);
        }
        .region-unlocked:hover {
            transform: translate(-2px, -2px);
            filter: drop-shadow(6px 6px 0px #181c1c);
        }
        .region-locked {
            filter: brightness(0.4) grayscale(80%) drop-shadow(2px 2px 0px #181c1c);
        }
        
        /* Modal animation */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animate {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .film-sprocket {

<script>
        function openCheckInModal() {
            document.getElementById('checkInModal').style.display = 'flex';
        }

        function openLocationDetails(title, status) {
            document.getElementById('modalLocationTitle').innerText = title;
            const statusEl = document.getElementById('modalLocationStatus');
            const reqsEl = document.getElementById('lockedRequirements');
            
            if(status === 'unlocked') {
                statusEl.innerText = 'Now Playing (Unlocked)';
                statusEl.className = 'font-label-bold text-primary tracking-widest uppercase mt-1';
                reqsEl.style.display = 'none';
            } else {
                statusEl.innerText = 'Coming Soon (Locked)';
                statusEl.className = 'font-label-bold text-error tracking-widest uppercase mt-1';
                reqsEl.style.display = 'block';
            }
            
            document.getElementById('locationModal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Close modals on clicking outside
        window.onclick = function(event) {
            const checkIn = document.getElementById('checkInModal');
            const location = document.getElementById('locationModal');
            if (checkIn && event.target == checkIn) {
                checkIn.style.display = 'none';
            }
            if (location && event.target == location) {
                location.style.display = 'none';
            }
        }
    </script>
