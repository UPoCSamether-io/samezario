<style>
        /* Custom Dot Pattern for Background */
        .bg-dot-pattern {
            background-color: #2A7B7C;
            background-image: radial-gradient(rgba(247, 250, 249, 0.1) 2px, transparent 2px);
            background-size: 30px 30px;
        }
        
        /* Hard Shadows */
        .shadow-hard {
            box-shadow: 4px 4px 0px 0px #2D2D2D;
        }
        .shadow-hard-lg {
            box-shadow: 8px 8px 0px 0px #2D2D2D;
        }
        
        /* Film Strip Edges */
        .film-strip-edge {
            background-image: 
                linear-gradient(to bottom, transparent 4px, #f7faf9 4px, #f7faf9 8px, transparent 8px);
            background-size: 100% 16px;
        }
        
        /* Clapperboard Pattern */
        .clapper-stripes {
            background: repeating-linear-gradient(
                -45deg,
                #2D2D2D,
                #2D2D2D 10px,
                #f7faf9 10px,
                #f7faf9 20px
            );
        }
    </style>
<link data-snapdom="injected-import" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100..900;1,100..900&amp;family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet"></head>
<body class="h-full overflow-hidden bg-dot-pattern relative font-body-md text-on-surface">
<!-- Game World Content (Simulated) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
<!-- Simulated Food Dots -->
<div class="absolute top-1/4 left-1/4 w-3 h-3 bg-secondary-fixed-dim rounded-full shadow-hard"></div>
<div class="absolute top-1/2 left-1/3 w-4 h-4 bg-secondary-fixed-dim rounded-full shadow-hard"></div>
<div class="absolute bottom-1/3 right-1/4 w-3 h-3 bg-secondary-fixed-dim rounded-full shadow-hard"></div>
<div class="absolute top-1/3 right-1/3 w-5 h-5 bg-secondary-fixed-dim rounded-full shadow-hard"></div>
<!-- Player Entity (Simulated) -->
<div class="w-16 h-16 bg-surface border-[3px] border-clapperboard-black rounded-full shadow-hard-lg flex items-center justify-center relative">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="sailing" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sailing</span>
<!-- Direction Indicator -->
<div class="absolute -top-2 w-0 h-0 border-l-8 border-r-8 border-b-8 border-l-transparent border-r-transparent border-b-clapperboard-black rotate-0"></div>
</div>
</div>
<!-- HUD LAYER -->
<div class="absolute inset-0 pointer-events-none z-10 p-gutter md:p-container-margin flex flex-col justify-between">
<!-- TOP SECTION -->
<div class="flex justify-between items-start pointer-events-auto"><div class="flex flex-col gap-4"><div class="w-64 h-8 bg-surface-variant border-4 border-clapperboard-black shadow-hard flex relative overflow-hidden"><div class="absolute top-0 left-0 right-0 h-2 film-strip-edge opacity-50"></div><div class="h-full bg-primary w-[75%] border-r-4 border-clapperboard-black relative"><div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-4 h-4 bg-cinema-yellow rounded-full border-2 border-clapperboard-black z-10 shadow-[0_0_10px_#F3B553]"></div></div><div class="absolute bottom-0 left-0 right-0 h-2 film-strip-edge opacity-50 rotate-180"></div></div><div class="w-48 h-48 bg-surface border-4 border-clapperboard-black shadow-hard-lg relative p-2"><div class="w-full h-full border-2 border-outline-variant relative overflow-hidden" style="background-image: linear-gradient(#bec9c8 1px, transparent 1px), linear-gradient(90deg, #bec9c8 1px, transparent 1px); background-size: 10px 10px;"><div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-12 border-2 border-surface-tint border-dashed opacity-50"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 bg-primary rounded-full border border-clapperboard-black transform -translate-x-1/2 -translate-y-1/2 shadow-[0_0_4px_#006263]"></div><div class="absolute top-1/4 right-1/4 w-2 h-2 bg-error rounded-full border border-clapperboard-black"></div><div class="absolute bottom-1/3 left-1/3 w-2 h-2 bg-error rounded-full border border-clapperboard-black"></div><div class="absolute top-[10%] left-[20%] w-1.5 h-1.5 bg-cinema-yellow rounded-full"></div><div class="absolute top-[12%] left-[18%] w-1.5 h-1.5 bg-cinema-yellow rounded-full"></div><div class="absolute bottom-[20%] right-[10%] w-1.5 h-1.5 bg-cinema-yellow rounded-full"></div></div></div></div><div class="bg-surface border-4 border-clapperboard-black shadow-hard-lg w-64 self-start mt-2"><div class="clapper-stripes h-4 border-b-4 border-clapperboard-black"></div><div class="p-3"><ul class="font-body-md text-sm space-y-1"><li class="flex justify-between items-center py-1"><span class="font-bold">1. SpielbergShark</span><span class="font-display-numeral text-xs">15,420</span></li><li class="flex justify-between items-center py-1 bg-cinema-yellow border-2 border-clapperboard-black px-2 -mx-2 shadow-[2px_2px_0px_0px_#2D2D2D] transform -rotate-1 relative z-10"><span class="font-bold text-on-surface">2. Director Samezario</span><span class="font-display-numeral text-xs text-on-surface">12,850</span></li><li class="flex justify-between items-center py-1"><span class="font-bold">3. FinFincher</span><span class="font-display-numeral text-xs">11,200</span></li></ul></div></div>
<!-- Top-Left: Logo -->
<!-- Top-Right: Leaderboard & Experience -->
</div>
<!-- BOTTOM SECTION -->
<div class="flex justify-between items-end pointer-events-auto">
<!-- Bottom-Left: Dash Gauge & Skill -->
<div class="flex items-end gap-6">
<!-- Skill Button (Clapperboard) -->
<button class="w-48 h-48 bg-cinema-yellow border-4 border-clapperboard-black shadow-hard-lg flex flex-col relative group active:translate-x-1 active:translate-y-1 active:shadow-none transition-all"><div class="h-12 clapper-stripes border-b-4 border-clapperboard-black w-full transform origin-bottom-left group-hover:-rotate-12 transition-transform duration-200"></div><div class="flex-1 flex items-center justify-center relative"><span class="material-symbols-outlined text-6xl" data-icon="movie" data-weight="fill" style="font-variation-settings: 'FILL' 1;">movie</span></div><div class="absolute -top-3 -right-3 w-12 h-12 bg-surface border-2 border-clapperboard-black rounded-full flex items-center justify-center font-label-bold shadow-[2px_2px_0px_0px_#2D2D2D] text-xl">E</div></button>

<div class="relative w-48 h-48 rounded-full border-4 border-clapperboard-black shadow-hard-lg bg-surface-variant flex items-center justify-center overflow-hidden"><div class="absolute inset-0 flex items-center justify-center"><div class="w-40 h-2 border-[3px] border-clapperboard-black bg-surface rotate-45"></div><div class="w-40 h-2 border-[3px] border-clapperboard-black bg-surface -rotate-45 absolute"></div><div class="w-40 h-2 border-[3px] border-clapperboard-black bg-surface absolute"></div><div class="w-2 absolute h-40 border-[3px] border-clapperboard-black bg-surface"></div></div><div class="w-12 h-12 rounded-full border-4 border-clapperboard-black bg-primary z-10 relative"></div><div class="absolute inset-0 bg-cinema-yellow z-0 opacity-80" style="clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 50%, 50% 50%); transform-origin: center; transform: rotate(-90deg);"></div><div class="absolute inset-0 border-4 border-clapperboard-black rounded-full pointer-events-none z-20"></div><div class="absolute -bottom-2 -left-2 w-12 h-12 bg-surface border-2 border-clapperboard-black rounded-full flex items-center justify-center font-label-bold shadow-[2px_2px_0px_0px_#2D2D2D] z-30 text-sm">SHIFT</div></div>
</div>
<!-- Bottom-Right: Minimap -->
</div>
</div>
