<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        .clapperboard-stripe {
            background: repeating-linear-gradient(
                45deg,
                #181c1c,
                #181c1c 10px,
                #ffffff 10px,
                #ffffff 20px
            );
        }
        .retro-shadow {
            box-shadow: 4px 4px 0px 0px #181c1c;
        }
        .neon-text {
            text-shadow: 0 0 10px #fabb59, 0 0 20px #fabb59;
        }
        .film-sprocket-bg {
            background-image: radial-gradient(circle, #f7faf9 30%, transparent 35%);
            background-size: 24px 24px;
            background-position: center;
        }
        /* Custom Dot Pattern for Background */
        .bg-dot-pattern {
            background-color: #2A7B7C;
            background-image: radial-gradient(rgba(247, 250, 249, 0.1) 2px, transparent 2px);
            background-size: 30px 30px;
        }
    </style>

<body class="bg-dot-pattern text-on-surface h-screen overflow-hidden flex flex-col justify-center items-center font-body-md relative select-none">
<!-- Top Letterboxing -->
<div class="absolute top-0 left-0 right-0 h-16 md:h-24 bg-on-surface z-50 shadow-2xl border-b-4 border-on-surface flex flex-row justify-around items-center overflow-hidden opacity-95">
<!-- Optional decorative film edge on top letterbox -->
<script>
            for(let i=0; i<30; i++) {
                document.write('<div class="w-4 h-2 bg-surface/20 rounded-sm mx-1"></div>');
            }
        </script>
</div>
<!-- Bottom Letterboxing -->
<div class="absolute bottom-0 left-0 right-0 h-16 md:h-24 bg-on-surface z-50 shadow-2xl border-t-4 border-on-surface flex flex-row justify-around items-center overflow-hidden opacity-95">
<!-- Optional decorative film edge on bottom letterbox -->
<script>
            for(let i=0; i<30; i++) {
                document.write('<div class="w-4 h-2 bg-surface/20 rounded-sm mx-1"></div>');
            }
        </script>
<!-- Footer / Version moved here -->
<div class="absolute bottom-4 right-8 font-label-bold text-label-bold text-surface-variant z-50">
            v1.0.0
        </div>
</div>
<!-- Main Content Area -->
<main class="w-full max-w-4xl px-[60px] flex flex-col items-center z-10 relative">
<!-- Central Logo / Neon Signage -->
<header class="mb-4 text-center transform -rotate-2 relative z-20">
<div class="absolute -inset-4 bg-primary-container blur-xl opacity-50 rounded-full"></div>
<h1 class="font-headline-xl text-[64px] md:text-[100px] text-secondary-fixed-dim neon-text border-8 border-on-surface bg-inverse-surface px-10 py-4 rounded-3xl retro-shadow leading-none tracking-tighter">
                サメザリオ
            </h1>
<p class="font-headline-lg text-headline-lg text-primary-fixed mt-4 bg-on-surface px-4 py-1 inline-block rounded-md border-2 border-surface shadow-[4px_4px_0px_0px_#87d3d4]">
                SAMEZARIO
            </p>
</header>
<!-- Prominent Shark Character -->
<div class="relative z-10 -mt-6 mb-8 transform hover:scale-105 transition-transform duration-300">
<img alt="Jindaiji Shark" class="w-48 md:w-72 h-auto object-contain drop-shadow-[8px_8px_0px_#181c1c]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1Yy8vvKgiNPWtVCcp0Lar8p3DXD6UJy8At-DlgjjeTluiQ9LpHrDjwADjxcMXZmVDeFU10L8-yG4ZTUp_DsWWjdgXqux8x6a2xENE9WHE9DYtmldEAzGmKuUOkXtN9MD67nIjeGaEGbxLTdf6iTzSZWMUoB2gf98qSOYMaq2dPxvg7Y78FnLrWfjzNAhpqhemehjr9ifUdZOiD4X_-JqumqX7tscmbr8qa-6X9aYgwOl-QgSzJRho7ocbdYzF3uSZiw">
</div>
<!-- Menu Buttons (Clapperboard Style) -->
<nav class="flex flex-col gap-4 w-full max-w-sm z-20 relative">
<!-- Game Start -->
<button class="w-full relative group active:translate-x-1 active:translate-y-1 transition-all">
<div class="absolute inset-0 bg-on-surface rounded-xl translate-x-[4px] translate-y-[4px]"></div>
<div class="relative bg-secondary-fixed border-[3px] border-on-surface rounded-xl flex flex-col overflow-hidden">
<!-- Clapper Header -->
<div class="h-6 clapperboard-stripe border-b-[3px] border-on-surface"></div>
<!-- Button Body -->
<div class="py-3 px-6 flex items-center justify-between bg-secondary-container group-hover:bg-secondary-fixed transition-colors">
<span class="font-headline-lg text-[24px] md:text-[28px] font-bold text-on-surface">ゲームスタート</span>
<span class="material-symbols-outlined text-3xl text-on-surface">movie</span>
</div>
</div>
</button>
<!-- Shark Encyclopedia -->
<button class="w-full relative group active:translate-x-1 active:translate-y-1 transition-all">
<div class="absolute inset-0 bg-on-surface rounded-xl translate-x-[4px] translate-y-[4px]"></div>
<div class="relative bg-surface border-[3px] border-on-surface rounded-xl flex flex-col overflow-hidden">
<div class="h-6 clapperboard-stripe border-b-[3px] border-on-surface"></div>
<div class="py-3 px-6 flex items-center justify-between bg-surface-variant group-hover:bg-surface transition-colors">
<span class="font-headline-lg-mobile text-[20px] md:text-[24px] font-bold text-on-surface">サメ図鑑</span>
<span class="material-symbols-outlined text-3xl text-on-surface">menu_book</span>
</div>
</div>
</button>
<!-- How to Play -->
<button class="w-full relative group active:translate-x-1 active:translate-y-1 transition-all">
<div class="absolute inset-0 bg-on-surface rounded-xl translate-x-[4px] translate-y-[4px]"></div>
<div class="relative bg-surface border-[3px] border-on-surface rounded-xl flex flex-col overflow-hidden">
<div class="h-6 clapperboard-stripe border-b-[3px] border-on-surface"></div>
<div class="py-3 px-6 flex items-center justify-between bg-surface-variant group-hover:bg-surface transition-colors">
<span class="font-headline-lg-mobile text-[20px] md:text-[24px] font-bold text-on-surface">遊び方</span>
<span class="material-symbols-outlined text-3xl text-on-surface">help_center</span>
</div>
</div>
</button>
</nav>
</main>
<!-- Decorative Elements (Optional: Kept from original to add depth) -->
<div class="fixed top-20 left-16 w-32 h-32 bg-secondary-fixed rounded-full border-4 border-on-surface -z-10 retro-shadow blur-sm opacity-30"></div>
<div class="fixed bottom-24 right-20 w-48 h-48 bg-primary-fixed rounded-full border-4 border-on-surface -z-10 retro-shadow blur-sm opacity-30"></div>
