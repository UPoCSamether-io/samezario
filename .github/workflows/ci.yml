name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (Node.js 24.18.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24.18.0 with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Verify package-lock.json is unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Build production bundle (npm run build)
        run: npm run build

      - name: Run tests, including server/relay.test.mjs (npm test)
        run: npm test
